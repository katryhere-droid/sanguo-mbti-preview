    const IV = "ibXSsXb5TlZPVtww";
    const API_URL = "https://sanguo-mbti-results.sanguo-mbti-results.workers.dev";
    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const form = document.getElementById("gateForm");
    const input = document.getElementById("inviteCode");
    const error = document.getElementById("error");
    const button = document.getElementById("unlockButton");

    async function openTest(accessToken, contentKey) {
      if (!/^[A-Za-z0-9_-]+.[A-Za-z0-9_-]+$/.test(accessToken || "")) throw new Error("invalid token");
      const rawKey = bytes(contentKey || "");
      if (rawKey.length !== 32) throw new Error("invalid key");
      const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
      const plain = await crypto.subtle.decrypt(
        {name:"AES-GCM", iv:bytes(IV)}, key, bytes(PAYLOAD)
      );
      const html = new TextDecoder().decode(plain).replace("__ACCESS_TOKEN__", accessToken);
      document.open();
      document.write(html);
      document.close();
    }

    async function resumeAuthorization() {
      const params = new URLSearchParams(location.hash.slice(1));
      const accessToken = params.get("access");
      const contentKey = params.get("key");
      const failure = params.get("error");
      if (!accessToken && !contentKey && !failure) return;
      history.replaceState(null, "", location.pathname + location.search);
      if (failure) {
        error.textContent = failure === "code"
          ? "授权码无效或次数已用完。"
          : "验证服务暂不可用，请稍后重试。";
        return;
      }
      button.disabled = true;
      button.textContent = "正在进入…";
      try {
        await openTest(accessToken, contentKey);
      } catch {
        error.textContent = "授权已通过，但测试加载失败，请刷新后重试。";
        button.disabled = false;
        button.textContent = "进入测试";
      }
    }

    form.addEventListener("submit", () => {
      error.textContent = "";
      input.value = input.value.trim().toUpperCase();
      button.disabled = true;
      button.textContent = "正在进入…";
