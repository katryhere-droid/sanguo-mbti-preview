    const SALT = "QC9DQnbD+FbnogVEO9vCjA==";
    const IV = "hnobaD6txQu6boZi";
    const ITERATIONS = 310000;
    const bytes = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
    const form = document.getElementById("gateForm");
    const input = document.getElementById("inviteCode");
    const error = document.getElementById("error");
    const button = document.getElementById("unlockButton");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      error.textContent = "";
      button.disabled = true;
      button.textContent = "正在验证…";
      try {
        const code = input.value.trim().toUpperCase();
        const material = await crypto.subtle.importKey(
          "raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]
        );
        const key = await crypto.subtle.deriveKey(
          {name:"PBKDF2", salt:bytes(SALT), iterations:ITERATIONS, hash:"SHA-256"},
          material,
          {name:"AES-GCM", length:256},
          false,
          ["decrypt"]
        );
        const plain = await crypto.subtle.decrypt(
          {name:"AES-GCM", iv:bytes(IV)}, key, bytes(PAYLOAD)
        );
        const html = new TextDecoder().decode(plain);
        document.open();
        document.write(html);
        document.close();
      } catch {
        error.textContent = "邀请码不正确，请重新输入。";
        input.select();
        button.disabled = false;
        button.textContent = "进入测试";
